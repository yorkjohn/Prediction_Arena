<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1420">
  <title>Prediction Arena · 组织者看板</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="dash">
  <div class="wrap">
    <div class="topbar">
      <div class="brand">Prediction Arena<small>组织者匿名看板 · 每 3 秒刷新</small></div>
      <div id="status" class="muted"><span class="dot off" id="statusDot"></span><span id="statusText">连接中…</span></div>
    </div>
    <div class="banner">
      真实市场题库（150 道）：参考概率为公开历史数据的事前快照，各平台 API 展示许可待人工核实。看板只显示匿名聚合数据，不显示个人昵称或单人预测。
    </div>
    <a class="btn ghost" style="display:inline-block;width:auto;text-decoration:none;padding:8px 16px;font-size:13px;margin-bottom:16px"
       href="http://127.0.0.1:5000/api/export.csv">导出成绩 CSV（仅组织者本机可下载）</a>

    <div class="dash-grid" id="cards"></div>

    <div class="card">
      <h2>各类别参与局数</h2>
      <div id="cat"><span class="muted">暂无数据</span></div>
    </div>

    <div class="card">
      <h2>每道题的匿名平均 YES 概率</h2>
      <table>
        <thead><tr><th>题目</th><th class="num">提交人数</th><th class="num">平均 YES 概率</th><th style="width:24%">分布</th></tr></thead>
        <tbody id="rows"><tr><td colspan="4" class="muted">暂无提交</td></tr></tbody>
      </table>
      <p class="tiny" style="margin-top:14px">只统计真正回答过该题的参与者；不同用户抽到不同题目。</p>
    </div>

    <p class="tiny" id="updated"></p>
  </div>
  <script src="/static/dashboard.js"></script>
</body>
</html>
